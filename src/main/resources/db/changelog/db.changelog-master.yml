databaseChangeLog:
  - changeSet:
      id: create-table-reservations
      author: seecret
      comment: first liquibase migration create
      changes:
        - createTable:
            tableName: reservations
            columns:
              - column:
                  name: id
                  type: INTEGER
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: room_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(55)
                  constraints:
                    nullable: false

  - changeSet:
      id: insert-into-reservations
      author: seecret
      comment: first liquibase migration insert
      changes:
        - insert:
            tableName: reservations
            columns:
              - column: { name: user_id, value: 11 }
              - column: { name: room_id, value: 21 }
              - column: { name: start_date, value: 2023-11-12 }
              - column: { name: end_date, value: 2023-11-22 }
              - column: { name: status, value: PENDING }

        - insert:
            tableName: reservations
            columns:
              - column: { name: user_id, value: 12 }
              - column: { name: room_id, value: 22 }
              - column: { name: start_date, value: 2023-11-15 }
              - column: { name: end_date, value: 2023-11-18 }
              - column: { name: status, value: APPROVED }

        - insert:
            tableName: reservations
            columns:
              - column: { name: user_id, value: 13 }
              - column: { name: room_id, value: 23 }
              - column: { name: start_date, value: 2023-11-20 }
              - column: { name: end_date, value: 2023-11-25 }
              - column: { name: status, value: CANCELLED }